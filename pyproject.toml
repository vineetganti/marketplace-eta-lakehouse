[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-replayer"
version = "0.1.0"
description = "Event replayer + reconciliation tooling for the marketplace ETA lakehouse"
requires-python = ">=3.10"
dependencies = [
  "confluent-kafka>=2.5",
  "psycopg[binary]>=3.2",
  "pandas>=2.0",
  "pyarrow>=15",
  "trino>=0.330",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["replayer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
